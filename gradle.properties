# AndroidX
android.useAndroidX=true
android.nonTransitiveRChannel=true

# 抑制 AGP 8.1 对 compileSdk 34 的警告
android.suppressUnsupportedCompileSdk=34

# 禁用有问题的 JDK image transform（AGP 8.1 + JDK 21 jlink 不兼容）
android.experimental.enableJdkImageTransform=false

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

# 强制使用 JDK 17（Temurin 17.0.21+9，位于 C:\unsunghero\jdk17；而不是 PATH 里的 JRE 8）
org.gradle.java.home=C\:\\unsunghero\\jdk17\\jdk-17.0.21+9

# ⚠️ 数据保护（2026-11-20 事故）：connectedAndroidTest 跑完，AGP 会**卸载被测 App**，
# 卸载 = 删掉 /data/data/com.companion.chat 整个目录 → 会话、记忆、API Key 全没且无法恢复。
#
# 下面这条原本想让 AGP 保留已安装的 APK，但 **2026-11-20 实测对 AGP 8.1.0 无效**：
# 测试结束的清理阶段仍然执行了卸载（`pm path` 变空）。保留仅为将来 AGP 支持时无需再找。
#
# ⇒ 真正可靠的防线是 `tools\deploy.ps1 -RunTests`：它在跑 instrumented 测试前自动
#    `tools\app-data-backup.ps1 -Backup`、测试后自动 -Restore（该链路已实测通过）。
#    **不要**直接敲 `gradlew connectedDebugAndroidTest`。
android.injected.androidTest.leaveApksInstalledAfterRun=true
