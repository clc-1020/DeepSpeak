plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// 发布签名：从根目录 keystore.properties 读取（该文件与 *.jks 已在 .gitignore，绝不进仓库）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Room schema 导出：必须是顶层块，不能放进 android {}（否则 Could not find method kapt()）
// §3.1.1 第 3/4 条；导出顺序：先 version=6 得到 6.json，再升 7 得到 7.json
kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

android {
    namespace 'com.companion.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.companion.chat"
        minSdk 26
        targetSdk 34
        versionCode 90
        versionName "1.13.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            // 分享给别人：只打真机常见架构（arm64 + 32 位老机），去掉 x86/x86_64（仅模拟器用），省约 32MB
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 1.9.4.2：debug 也用同一 release keystore 签名，这样 debug/release 能互相覆盖安装、数据保留。
            // 没有 keystore.properties（如别人 clone 仓库）时回退 Android 默认 debug 签名，正常开发不受影响。
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            signingConfig signingConfigs.release
            // 1.9.4.1：分享版开 R8 代码裁剪 + 资源压缩（debug 期 dex 有 60MB，release 实际砍到 ~4.4MB）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // JVM 单元测试里 android.util.Log 等是未实现 stub，默认会抛 "not mocked"。
    // 回调线程中的这类异常曾导致 callbackFlow 不 close、测试挂死（V2.1.8），这里统一返回默认值。
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // MigrationTestHelper 从 androidTest APK 的 assets/ 加载导出 schema；把顶层 schemas 目录挂进去
    sourceSets {
        androidTest {
            assets.srcDirs += ["$projectDir/schemas"]
        }
    }
}

dependencies {
    // Kotlin & Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.navigation:navigation-compose:2.7.5'
    
    // Room
    def room_version = "2.6.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Jetpack Security（加密存储 API Key）
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ONNX Runtime (for embedding model)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'

    // Sherpa-ONNX (offline STT) — 手动下载 AAR 放到 app/libs/
    // 从 https://github.com/k2-fsa/sherpa-onnx/releases 下载 sherpa-onnx-VERSION-android.aar
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    // §3.1.1 第 5 条：MigrationTestHelper 依赖
    androidTestImplementation "androidx.room:room-testing:$room_version"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
